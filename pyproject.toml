[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Defect-focused: correctness, security, async, modernisation, simplification.
select = ["E", "W", "F", "B", "S", "UP", "SIM", "PL", "RUF", "ASYNC", "I", "PERF", "TRY", "RET", "PIE", "PTH", "LOG", "G", "DTZ", "A", "C4", "ISC", "N"]
ignore = [
  "PLR0911", "PLR0912", "PLR0915", # protocol dispatch is one big match by design
  "PLR2004",                       # magic numbers
  "TRY003",                        # long exception messages
  "S603",                          # subprocess with fixed argv
  "S104",                          # binding all interfaces is a documented config choice
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
